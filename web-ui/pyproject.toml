[project]
name = "mihomo-web-ui"
version = "0.1.0"
description = "Optional local web UI for mihomo-proxy-setup (same operations as mihomo.sh)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
mihomo-web = "mihomo_web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mihomo_web"]
